version = 1

# declares copyright and license metadata for files that can't easily contain license headers themselves.
[[annotations]]
path = ["LICENSE", "NOTICE", "CONTRIBUTORS", "LICENSES/**.txt"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["icons/**", "frontend/public/logo.png"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "capabilities/default.json",
  "frontend/bun.lock",
  "frontend/package.json",
  "frontend/tsconfig.json",
  "gen/schemas/**",
  "frontend/.prettierrc",
  ".DS_Store",
]
SPDX-License-Identifier = "Apache-2.0"
