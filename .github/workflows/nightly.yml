name: Nightly Advisories
on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml
  advisories:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
      - name: Install tools
        run: make install-tools
      - name: Check advisories
        run: make deny ARGS=advisories
