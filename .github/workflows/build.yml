name: Rust CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml
  build_and_test:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install tools
        run: make install-tools
      - name: Build
        run: make build ARGS=--verbose
      - name: Check licenses
        run: make deny ARGS=licenses
      - name: Check allowed sources
        run: make deny ARGS=sources
      - name: Check banned practises
        run: make deny ARGS=bans
      - name: Test
        run: make test ARGS="-- --show-output"
  build_all_features:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.stable }}
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Build with all features
        run: make build ARGS="--all-features --verbose"
      - name: Test with all features
        run: make test ARGS="--all-features -- --show-output"
