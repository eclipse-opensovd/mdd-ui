name: pre-commit
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  versions:
    uses: ./.github/workflows/tool-versions.yml
  pre-commit:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install nightly Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.nightly }}
          components: clippy, rustfmt
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Go (required for gitleaks)
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache prek hooks
        uses: actions/cache@v5
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-
      # All hooks, including the manual-stage clippy with all features.
      - name: Run checks
        run: make precommit-all-features
